name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Build (universal app + dmg + zip)
        run: ./build.sh release

      - name: Verify architectures and signature
        run: |
          lipo -archs dist/RestReminder.app/Contents/MacOS/RestReminder
          codesign --verify --strict dist/RestReminder.app

      - name: Upload dmg + zip
        uses: actions/upload-artifact@v4
        with:
          name: RestReminder-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
